# A2C Agent with Transformer Policy Configuration
# Note: name must be "A2C" for Pydantic validation (policy type is specified in policy_kwargs)

name: "A2C"
algorithm: "stable_baselines3.A2C"

hyperparameters:
  # Learning
  learning_rate: 3.0e-4  # Lower LR for transformer (more parameters)
  n_steps: 5  # Number of steps per environment per update

  # Discount and advantage
  gamma: 0.99
  gae_lambda: 1.0  # GAE lambda (1.0 = no GAE, standard advantage)

  # Regularization
  ent_coef: 0.01  # Entropy coefficient
  vf_coef: 0.5  # Value function coefficient
  max_grad_norm: 0.5  # Important for transformer stability

  # Network architecture - Transformer Policy
  policy: "TransformerPolicy"
  policy_kwargs:
    # Network architecture for policy and value heads (after transformer)
    net_arch:
      pi: [128, 64]  # Policy head: transformer output -> 128 -> 64 -> actions
      vf: [128, 64]  # Value head: transformer output -> 128 -> 64 -> value

    activation_fn: "ReLU"
    normalize_images: false

    # Transformer feature extractor configuration
    features_extractor_class: rl_trading_lab.models.TransformerFeatureExtractor
    features_extractor_kwargs:
      # Observation parameters (must match environment)
      lookback_window: 20  # Number of timesteps in sequence
      n_features: 4  # Number of features per timestep (from observation config)

      # Transformer architecture
      d_model: 128  # Transformer hidden dimension
      nhead: 4  # Number of attention heads (must divide d_model)
      num_encoder_layers: 2  # Number of transformer encoder layers
      dim_feedforward: 256  # Feedforward network dimension
      dropout: 0.1  # Dropout rate for regularization

      # Sequence aggregation method
      aggregation: "mean"  # Options: "mean", "last", "cls"

  # RMS Prop optimizer
  rms_prop_eps: 1.0e-5
  use_rms_prop: true
  normalize_advantage: false

# Training settings specific to this agent
verbose: 1
tensorboard_log: "./logs/a2c_transformer"

# Recommended training timesteps for A2C with Transformer
# A2C typically needs more steps than PPO; transformer may need even more
training:
  total_timesteps: 500_000  # May need longer for transformer to converge
  eval_freq: 10_000
  save_freq: 50_000

# Notes:
# - A2C is more sample-efficient than PPO but less stable
# - Transformer with A2C can be powerful for capturing temporal patterns
# - Use RMSProp optimizer (default for A2C)
# - Consider lowering n_steps if training is unstable
# - Ensure n_features matches your observation config
